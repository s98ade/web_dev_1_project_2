<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Finder</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header class="site-header">
            <h1>Movie Finder</h1>
            <p>Search movies and series from the Open Movie Database.</p>
        </header>

        <main>
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search a title" required>

                <select id="type-select">
                    <option value="">All</option>
                    <option value="movie">Movies</option>
                    <option value="series">Series</option>
                </select>

                <button type="submit">Search</button>
            </form>

            <p id="status"></p>

            <section id="results"></section>

        <footer class="site-footer">
            Data from the <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb API</a>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
